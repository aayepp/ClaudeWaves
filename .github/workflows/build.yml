name: Build ClaudeWaves APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'Screenshot/**'
      - '**.yml'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'Screenshot/**'
      - '**.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      ADDON_CLIENT_SECRET: ${{ secrets.ADDON_CLIENT_SECRET }}
      RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
      LASTWAVE_LYRICS_TOKEN: ${{ secrets.LASTWAVE_LYRICS_TOKEN }}
      LASTWAVE_LYRICS_URL: ${{ secrets.LASTWAVE_LYRICS_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '17'
          distribution: 'temurin'

      # Caches the Gradle build cache too (setup-java only caches deps), so
      # release.yml on a tag reuses outputs this main build wrote.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Cache C++/CMake native audio libraries (.cxx)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            app/.cxx
            audio/decent-usb-audio-driver/.cxx
          key: cxx-native-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/**', 'audio/decent-usb-audio-driver/src/main/cpp/**', '**/CMakeLists.txt') }}
          restore-keys: |
            cxx-native-${{ runner.os }}-

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --build-cache --stacktrace

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Debug-unit-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Build APK
        id: build_apk
        env:
          ADDON_CLIENT_SECRET: ${{ secrets.ADDON_CLIENT_SECRET }}
          LASTWAVE_LYRICS_TOKEN: ${{ secrets.LASTWAVE_LYRICS_TOKEN }}
          LASTWAVE_LYRICS_URL: ${{ secrets.LASTWAVE_LYRICS_URL }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS || secrets.RELEASE_KEY_ALIAS || 'release_key' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "${SIGNING_KEY:-}" ] && [ -n "${RELEASE_STORE_PASSWORD:-}" ]; then
            echo "variant=release" >> $GITHUB_OUTPUT
            ./gradlew assembleRelease -PtargetAbis=arm64-v8a,armeabi-v7a --build-cache --stacktrace
          else
            echo "variant=debug" >> $GITHUB_OUTPUT
            echo "::notice::Signing secrets not configured; building debug APK instead of failing."
            ./gradlew assembleDebug -PtargetAbis=arm64-v8a,armeabi-v7a --build-cache --stacktrace
          fi

      - name: Stage Final APK
        id: prep_apk
        env:
          BUILD_VARIANT: ${{ steps.build_apk.outputs.variant }}
        run: |
          mkdir -p final_apk
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            VERSION="5.2.9"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Staging $BUILD_VARIANT APK for ClaudeWaves v$VERSION"
          if [ "$BUILD_VARIANT" = "release" ]; then
            if [ -f "app/build/outputs/apk/release/app-release-signed.apk" ]; then
              cp app/build/outputs/apk/release/app-release-signed.apk final_apk/ClaudeWaves-v${VERSION}-release.apk
            else
              cp app/build/outputs/apk/release/app-release.apk final_apk/ClaudeWaves-v${VERSION}-release.apk
            fi
          else
            cp app/build/outputs/apk/debug/app-debug.apk final_apk/ClaudeWaves-v${VERSION}-debug.apk
          fi
          ls -lh final_apk/

      - name: Verify APK signature + publish checksum
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.EXPECTED_CERT_SHA256 }}
          BUILD_VARIANT: ${{ steps.build_apk.outputs.variant }}
        run: |
          SDKROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDKROOT/build-tools" -maxdepth 2 -name apksigner 2>/dev/null | head -n1)
          if [ -n "$APKSIGNER" ]; then
            EXPECTED_LOWER=$(printf '%s' "${EXPECTED_CERT_SHA256:-}" | tr 'A-F' 'a-f')
            for apk in final_apk/*.apk; do
              "$APKSIGNER" verify --print-certs "$apk" > /dev/null || { echo "::error::APK failed signature verification: $apk"; exit 1; }
              CERT_SHA=$("$APKSIGNER" verify --print-certs "$apk" 2>/dev/null | grep -i 'SHA-256 digest' | head -n1 | awk '{print $NF}' | tr 'A-F' 'a-f')
              echo "Signer cert SHA-256: $CERT_SHA"
              if [ -n "$EXPECTED_LOWER" ] && [ "$BUILD_VARIANT" = "release" ]; then
                case "$CERT_SHA" in
                  ${EXPECTED_LOWER}*) echo "Signer cert matches pin" ;;
                  *) echo "::error::$apk signed by unexpected certificate ($CERT_SHA); expected prefix ${EXPECTED_LOWER}"; exit 1 ;;
                esac
              fi
            done
          fi
          (cd final_apk && sha256sum *.apk > SHA256SUMS.txt)
          cat final_apk/SHA256SUMS.txt

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ClaudeWaves-v${{ steps.prep_apk.outputs.version }}-${{ steps.build_apk.outputs.variant }}
          path: |
            final_apk/*.apk
            final_apk/SHA256SUMS.txt
          retention-days: 30
