name: Sole Author Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  sole-author-check:
    name: Sole Author Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify commits are authored only by aayepp
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          FAIL=0

          while IFS='|' read -r sha an ae cn ce; do
            if [ "$an" != "aayepp" ] || [ "$ae" != "ayep.business@gmail.com" ]; then
              echo "::error::Commit $sha has disallowed author: $an <$ae> (must be aayepp <ayep.business@gmail.com>)"
              FAIL=1
            fi
            if [ "$ce" != "ayep.business@gmail.com" ] && [ "$ce" != "noreply@github.com" ]; then
              echo "::error::Commit $sha has disallowed committer: $cn <$ce>"
              FAIL=1
            fi
            msg=$(git log -1 --format=%B "$sha")
            if printf '%s' "$msg" | grep -qiE 'co-authored-by:|noreply@anthropic\.com|claude-session|generated with'; then
              echo "::error::Commit $sha message contains forbidden attribution trailer"
              FAIL=1
            fi
          done < <(git log --format='%H|%an|%ae|%cn|%ce' "${BASE_SHA}..${HEAD_SHA}")

          if [ "$FAIL" -ne 0 ]; then
            echo "Rewrite commits so author/committer is aayepp <ayep.business@gmail.com> with no attribution trailers."
            exit 1
          fi
          echo "All PR commits verified: aayepp only."
