name: Backup Secrets (encrypted)

# One-off: export the Actions secrets as an AES-256 encrypted archive so they
# survive a repository re-creation. Secrets are write-only in GitHub; this is
# the only way to get a copy back. Delete this workflow after use.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Export and encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          EXPECTED_CERT_SHA256: ${{ secrets.EXPECTED_CERT_SHA256 }}
          ADDON_CLIENT_SECRET: ${{ secrets.ADDON_CLIENT_SECRET }}
          LASTWAVE_LYRICS_TOKEN: ${{ secrets.LASTWAVE_LYRICS_TOKEN }}
          LASTWAVE_LYRICS_URL: ${{ secrets.LASTWAVE_LYRICS_URL }}
        run: |
          set -euo pipefail
          if [ "${#BACKUP_PASSPHRASE}" -lt 16 ]; then
            echo "::error::Set a BACKUP_PASSPHRASE secret of at least 16 characters first."
            exit 1
          fi
          umask 077
          mkdir -p out/secrets
          for name in SIGNING_KEY KEY_STORE_PASSWORD RELEASE_STORE_PASSWORD KEY_PASSWORD \
                      RELEASE_KEY_PASSWORD ALIAS RELEASE_KEY_ALIAS EXPECTED_CERT_SHA256 \
                      ADDON_CLIENT_SECRET LASTWAVE_LYRICS_TOKEN LASTWAVE_LYRICS_URL; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%s' "$value" > "out/secrets/$name.txt"
              echo "$name: saved"
            else
              echo "$name: not set"
            fi
          done
          if [ -s out/secrets/SIGNING_KEY.txt ]; then
            base64 -d out/secrets/SIGNING_KEY.txt > out/secrets/release.keystore
            STORE_PASS="${KEY_STORE_PASSWORD:-$RELEASE_STORE_PASSWORD}"
            KEY_ALIAS="${ALIAS:-${RELEASE_KEY_ALIAS:-release_key}}"
            # Prove the saved password opens the saved keystore; the fingerprint is public.
            keytool -list -v -keystore out/secrets/release.keystore -storepass "$STORE_PASS" -alias "$KEY_ALIAS" \
              | grep -E "^(Alias name|Owner|\s+SHA256):" || echo "::warning::Keystore did not open with the saved password."
          fi
          tar -C out -czf secrets.tgz secrets
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -in secrets.tgz -out claudewaves-secrets.tgz.enc -pass env:BACKUP_PASSPHRASE
          rm -rf out secrets.tgz

      - name: Upload encrypted archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: claudewaves-secrets
          path: claudewaves-secrets.tgz.enc
          retention-days: 1
