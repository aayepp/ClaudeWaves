name: Publish Selected Release

on:
  push:
    tags:
      - 'v*'
    # Cloud sessions cannot push tags; their release commit carries [auto-release] instead.
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Git Tag (e.g., v5.2.9)'
        required: true
        default: 'v5.2.9'
      release_name:
        description: 'Release Title (e.g., ClaudeWaves v5.2.9)'
        required: true
        default: 'ClaudeWaves v5.2.9'
      release_notes:
        description: 'Changelog / Release Notes'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & Publish Release
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[auto-release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      ADDON_CLIENT_SECRET: ${{ secrets.ADDON_CLIENT_SECRET }}
      RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
      LASTWAVE_LYRICS_TOKEN: ${{ secrets.LASTWAVE_LYRICS_TOKEN }}
      LASTWAVE_LYRICS_URL: ${{ secrets.LASTWAVE_LYRICS_URL }}
      EXPECTED_CERT_SHA256: ${{ secrets.EXPECTED_CERT_SHA256 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "::error::$TAG already exists; bump versionName before an [auto-release] push"
              exit 1
            fi
          fi
          echo "Release tag: $TAG"
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Cache C++/CMake native audio libraries (.cxx)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            app/.cxx
            audio/decent-usb-audio-driver/.cxx
          key: cxx-native-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/**', 'audio/decent-usb-audio-driver/src/main/cpp/**', '**/CMakeLists.txt') }}
          restore-keys: |
            cxx-native-${{ runner.os }}-

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Build Android Release APK
        env:
          ADDON_CLIENT_SECRET: ${{ secrets.ADDON_CLIENT_SECRET }}
          LASTWAVE_LYRICS_TOKEN: ${{ secrets.LASTWAVE_LYRICS_TOKEN }}
          LASTWAVE_LYRICS_URL: ${{ secrets.LASTWAVE_LYRICS_URL }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS || secrets.RELEASE_KEY_ALIAS || 'release_key' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PtargetAbis=arm64-v8a,armeabi-v7a --build-cache --stacktrace

      - name: Stage Final APK
        run: |
          mkdir -p final_apk
          if [ -f "app/build/outputs/apk/release/app-release-signed.apk" ]; then
            cp app/build/outputs/apk/release/app-release-signed.apk final_apk/ClaudeWaves.apk
          else
            cp app/build/outputs/apk/release/app-release.apk final_apk/ClaudeWaves.apk
          fi
          ls -lh final_apk/

      - name: Verify APK signatures + publish checksums
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.EXPECTED_CERT_SHA256 }}
        run: |
          SDKROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDKROOT/build-tools" -maxdepth 2 -name apksigner 2>/dev/null | head -n1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $SDKROOT — refusing to publish unverified APKs"
            exit 1
          fi
          EXPECTED_LOWER=$(printf '%s' "${EXPECTED_CERT_SHA256:-}" | tr 'A-F' 'a-f')
          for apk in final_apk/*.apk; do
            echo "Verifying $apk ..."
            "$APKSIGNER" verify --print-certs "$apk" > /dev/null || { echo "::error::APK failed signature verification: $apk"; exit 1; }
            CERT_SHA=$("$APKSIGNER" verify --print-certs "$apk" 2>/dev/null | grep -i 'SHA-256 digest' | head -n1 | awk '{print $NF}' | tr 'A-F' 'a-f')
            if [ -z "$CERT_SHA" ]; then
              echo "::error::Could not read signing certificate digest for $apk"; exit 1
            fi
            if [ -n "$EXPECTED_LOWER" ]; then
              case "$CERT_SHA" in
                ${EXPECTED_LOWER}*) echo "Signer cert matches pin: $CERT_SHA" ;;
                *) echo "::error::$apk signed by unexpected certificate ($CERT_SHA); expected prefix ${EXPECTED_LOWER}"; exit 1 ;;
              esac
            else
              echo "Signer cert OK: $CERT_SHA"
            fi
          done
          (cd final_apk && sha256sum *.apk > SHA256SUMS.txt)
          cat final_apk/SHA256SUMS.txt

      - name: Prepare Release Notes from CHANGELOG.md
        env:
          TAG: ${{ steps.tag.outputs.name }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          CLEAN_TAG="${TAG#v}"
          CLEAN_TAG="${CLEAN_TAG#V}"

          if [ -n "$NOTES" ]; then
            printf "%s\n" "$NOTES" > release_body.md
          else
            awk -v ver="$CLEAN_TAG" '
              $0 ~ "^## \\[" ver "\\]" { found=1; next }
              found && $0 ~ "^## \\[" { exit }
              found { print }
            ' CHANGELOG.md > extracted_notes.md

            if [ -s extracted_notes.md ]; then
              cat extracted_notes.md > release_body.md
            else
              echo "### What'\''s New in v${CLEAN_TAG}" > release_body.md
              echo "- Universal release build for Android 9.0 – 17 with R8 optimization and 16 KB page-aligned native audio libraries." >> release_body.md
            fi
          fi
          cat release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.release_name || format('ClaudeWaves {0}', steps.tag.outputs.name) }}
          body_path: release_body.md
          files: |
            final_apk/*.apk
            final_apk/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
